# Builds an installable (debug) Android APK of the Dugout Coach app.
# Runs when the app or either tool changes on main, or by hand from the Actions tab.
# The APK appears under the run's "Artifacts" as dugout-coach-debug-apk.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pitchpathlab/**"
      - "lineupsimulator/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build web bundle from the two tools
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Copy web bundle into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dugout-coach-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
